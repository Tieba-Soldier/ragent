name: ragent-cloud

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragent
      POSTGRES_USER: ragent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../resources/database/schema_pg.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../resources/database/init_data_pg.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragent -d ragent"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 384m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 128m
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.72
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
    command: ["--address", ":9000", "--access-key", "${RUSTFS_ACCESS_KEY}", "--secret-key", "${RUSTFS_SECRET_KEY}", "/data"]
    volumes:
      - rustfs_data:/data
    mem_limit: 256m
    restart: unless-stopped

  rmqnamesrv:
    image: apache/rocketmq:5.2.0
    platform: linux/amd64
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx192m -XX:MaxMetaspaceSize=96m"
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'The Name Server boot success' /home/rocketmq/logs/rocketmqlogs/namesrv.log"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 256m
    restart: unless-stopped

  rmq-init:
    image: alpine:3.20
    user: "0:0"
    command: ["sh", "-c", "chown -R 3000:3000 /home/rocketmq/store"]
    volumes:
      - rocketmq_store:/home/rocketmq/store
    restart: "no"

  rmqbroker:
    image: apache/rocketmq:5.2.0
    platform: linux/amd64
    environment:
      NAMESRV_ADDR: rmqnamesrv:9876
      JAVA_OPT_EXT: "-Xms256m -Xmx448m -XX:MaxMetaspaceSize=128m"
    command:
      - sh
      - -c
      - >-
        sh mqbroker -n rmqnamesrv:9876
    depends_on:
      rmqnamesrv:
        condition: service_healthy
      rmq-init:
        condition: service_completed_successfully
    volumes:
      - rocketmq_store:/home/rocketmq/store
    mem_limit: 640m
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile.backend
    environment:
      SERVER_PORT: "9081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ragent?client_encoding=UTF8
      SPRING_DATASOURCE_USERNAME: ragent
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "6"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      ROCKETMQ_NAME_SERVER: rmqnamesrv:9876
      RAG_STORAGE_S3_ENDPOINT: http://rustfs:9000
      RAG_STORAGE_S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RAG_STORAGE_S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RAG_RATE_LIMIT_GLOBAL_MAX_CONCURRENT: "2"
      RAG_SEMAPHORE_DOCUMENT_UPLOAD_MAX_CONCURRENT: "1"
      RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-false}
      RAG_SEARCH_EVIDENCE_MIN_RERANK_SCORE: "0"
      RAGENT_ENGINE_TYPE: ${RAGENT_ENGINE_TYPE:-workflow}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      AIHUBMIX_API_KEY: ${AIHUBMIX_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      MINERU_API_KEY: ${MINERU_API_KEY:-}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC"
    expose:
      - "9081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
      rmqbroker:
        condition: service_started
    mem_limit: 1280m
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile.frontend
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_started
    mem_limit: 96m
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  rocketmq_store:
